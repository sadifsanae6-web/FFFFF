{% extends "base.html" %}
{% block content %}
<div class="page-header"><h2>Nouvelle facture</h2><p>Rapprochement commande / réception / facture</p></div>
<form method="post" class="panel form-grid">
  <label>Commande liée<select name="order_id" required id="order_id">{% for o in orders %}<option value="{{ o.id }}" data-payable="{{ '%.2f'|format(o.payable_amount_now) }}">{{ o.code }} - {{ o.purchase_request.code }} - {{ o.supplier_name }} | Accepté: {{ '%.2f'|format(o.accepted_amount) }} DH | Déjà facturé: {{ '%.2f'|format(o.already_invoiced_amount) }} DH | Reste facturable: {{ '%.2f'|format(o.payable_amount_now) }} DH</option>{% endfor %}</select></label>
  <label>Fournisseur<input name="supplier_name"></label>
  <label>Montant facture<input type="number" step="0.01" name="amount" id="amount" required></label>
  <label>Date facture<input type="date" name="invoice_date"></label>
  <label>Échéance<input type="date" name="due_date"></label>
  <div class="full"><button class="btn primary" type="submit">Enregistrer</button></div>
</form>
<script>
  const orderSelect = document.getElementById('order_id');
  const amountInput = document.getElementById('amount');
  function fillPayableAmount(){
    const opt = orderSelect?.selectedOptions?.[0];
    if (opt && amountInput) amountInput.value = opt.dataset.payable || '';
  }
  orderSelect?.addEventListener('change', fillPayableAmount);
  fillPayableAmount();
</script>
{% endblock %}
